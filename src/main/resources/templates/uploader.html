<html lang="EN">
<head>
    <title> Ajax Spring File Upload Example </title>
</head>
<body>

<input id="file_upload" type="file" name="file_upload" />
<label for="docCardId"></label><input id="docCardId" type="text" name="docCardId" placeholder="Enter docCardId" />
<button id="upload-button" onclick="uploadFile()"> Upload </button>

<!-- Ajax JavaScript File Upload to Spring Boot Logic -->
<script>
    async function uploadFile() {
        let formData = new FormData();
        formData.append("file", file_upload.files[0]);
        let docCardId = document.getElementById('docCardId').value;
        let response = await fetch('/rest/admin-ui/files/upload?docCardId=' + docCardId, {
            method: "POST",
            body: formData
        });

        if (response.status === 200) {
            alert("File successfully uploaded.");
        }
    }
</script>

</body>
</html>
