databaseChangeLog:
  - changeSet:
      id: 1738418612305-1
      author: Vadim
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: PK_DOC_CARD
                  name: ID
                  type: UUID
              - column:
                  name: NAME
                  type: VARCHAR(255)
              - column:
                  name: change_date
                  type: VARCHAR(255)
              - column:
                  name: key_words
                  type: VARCHAR(255)
              - column:
                  name: reg_num
                  type: VARCHAR(255)
              - column:
                  name: type_document_id
                  type: UUID
              - column:
                  name: user_id
                  type: UUID
              - column:
                  name: DESCRIPTION
                  type: VARCHAR(255)
            tableName: DOC_CARD
        - addForeignKeyConstraint:
            baseColumnNames: type_document_id
            baseTableName: doc_card
            constraintName: FK_DOC_CARD_ON_TYPE_DOCUMENT
            referencedColumnNames: id
            referencedTableName: TYPE_DOCUMENT
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: doc_card
            constraintName: FK_DOC_CARD_ON_USER
            referencedColumnNames: id
            referencedTableName: users
